  <script>
    async function carregarHistoricoResumido() {
  const container = document.getElementById('listaHistoricoResumido');
  
  try {
    const res = await fetch('/api/usuario/historico-resumido');
    const tentativas = await res.json();

    if (tentativas.length === 0) {
      container.innerHTML = '<p style="color:#a0aec0; font-size:14px;">Nenhum simulado feito ainda.</p>';
      return;
    }

    container.innerHTML = tentativas.map(tentativa => {
      const dataFormatada = new Date(tentativa.data_realizacao).toLocaleDateString('pt-BR');
      
      return `
        <div class="item-historico-resumido">
          <strong>${tentativa.titulo_simulado}</strong>
          <div class="meta">
            <span>Nota: ${tentativa.pontuacao} pts</span>
            <span>${dataFormatada}</span>
          </div>
        </div>
      `;
    }).join('');

  } catch (error) {
    container.innerHTML = '<p style="color:#f56565; font-size:14px;">Erro ao carregar dados.</p>';
  }
}

carregarHistoricoResumido();

  </script>
